name: Mega Drive ROM

# Builds the Mega Drive ROM with md/build.sh (SGDK in Docker).
#   push to main  -> ROM as workflow artifact (90 days)
#   tag v*        -> additionally a GitHub release with the .bin and SHA256SUMS.txt,
#                    which tools/update-rom-on-device.sh downloads
#   manual run    -> ROM as artifact

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['md/**', 'src/core/**', 'assets/**', 'data/**', 'tools/**', 'tests/**', '.github/workflows/md-rom.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rom:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only used by the release step on tags
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Generates build/tiles.bin and src/core/gen/ (md/build.sh needs both) and
      # runs the host selftest first, so a broken core never becomes a ROM.
      - name: Host build and selftest
        run: |
          uv run tools/build.py --host
          uv run tools/test.py --host --no-build --verbose

      - name: Mega Drive resources
        run: |
          uv run tools/png2md.py
          uv run tools/md_assets.py
          uv run tools/md_help.py
          uv run tools/md_sound.py

      - name: Build ROM (SGDK, docker)
        run: |
          DOCKER_ARGS="--user $(id -u):$(id -g) -e HOME=/tmp" md/build.sh

      - name: Name and checksum
        id: rom
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          NAME="lords-of-chaos-md-${VERSION}.bin"
          mkdir -p dist
          cp out/md/out/rom.bin "dist/${NAME}"
          (cd dist && sha256sum "${NAME}" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "ROM: ${NAME} ($(stat -c %s "dist/${NAME}") bytes)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: md-rom
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --notes "Mega Drive ROM, built by CI from ${GITHUB_SHA::7}. Install on the handheld with tools/update-rom-on-device.sh."
          fi
